services:
  bot:
    build:
      context: ./solver-bot
      dockerfile: Dockerfile
    container_name: diffy-bot
    env_file:
      - .env
    environment:
      - SOLVER_API_URL=http://server:8080/api/solver
    depends_on:
      server:
        condition: service_healthy
      database:
        condition: service_healthy
    networks:
      - net
    restart: unless-stopped

  server:
    build:
      context: ./solver-common
      dockerfile: Dockerfile
    container_name: diffy-bot-server
    env_file:
      - .env
    environment:
      - DB_HOST=database
    ports:
      - "8080:8080"
    volumes:
      - .env:/solver-server/.env:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks:
      - net
    restart: unless-stopped

  database:
    image: postgres:17.5-alpine
    container_name: diffy-bot-database
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  net:
    driver: bridge