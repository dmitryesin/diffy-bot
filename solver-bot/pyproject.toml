[project]
name = "solver-bot"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "aiohttp==3.12.15",
    "matplotlib==3.10.5",
    "numpy==2.3.2",
    "pydantic-settings>=2.6",
    "python-telegram-bot==22.3",
    "sympy==1.14.0",
]

[project.scripts]
solver-bot = "src.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"